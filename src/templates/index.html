<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Shop Assist — Smart Apparel Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="header-top">
                    <div class="logo">
                        <i class="fas fa-tshirt"></i>
                        <h1>Shop Assist — Smart Apparel Assistant</h1>
                    </div>
                    <div class="header-actions">
                        <button id="userButton" class="user-button" title="Account">
                            <i class="fas fa-user-circle"></i>
                            <span id="userStatus" class="user-status">Login</span>
                        </button>
                        <button id="cartButton" class="cart-button" style="display: none;">
                            <i class="fas fa-shopping-cart"></i>
                            <span id="cartBadge" class="cart-badge">0</span>
                        </button>
                    </div>
                </div>
                <p class="subtitle">Ask me about shirts, dresses, footwear, or accessories. I'll find options from our stores for you!</p>
            </div>
        </header>

        <!-- Chat Container -->
        <main class="chat-container">
            <div class="chat-window" id="chatWindow">
                <div class="chat-messages" id="chatMessages">
                    <div class="welcome-message">
                        <div class="bot-avatar">
                            <i class="fas fa-shopping-bag"></i>
                        </div>
                        <div class="message-content">
                            <p>Hello! I'm here to help you find the perfect Shop Assist products. What are you looking for today?</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-container">
                <div class="input-group">
                    <div class="input-wrapper">
                        <input type="text" id="messageInput" placeholder="Ask about any apparel... e.g., Show me black party dresses" autocomplete="off">
                        <button id="voiceButton" class="btn-voice-inline" title="Voice Input">
                            <i class="fas fa-microphone"></i>
                        </button>
                    </div>
                    <button id="sendButton" class="btn btn-primary">
                        <i class="fas fa-paper-plane"></i>
                        <span>Send</span>
                    </button>
                    <button id="clearButton" class="btn btn-danger">
                        <i class="fas fa-trash"></i>
                        <span>Clear</span>
                    </button>
                </div>
                <div id="voiceStatus" class="voice-status" style="display: none;">
                    <i class="fas fa-microphone-alt"></i>
                    <span id="voiceStatusText">Listening...</span>
                </div>
                <div class="question-suggestions" id="questionSuggestions">
                    <!-- <button class="suggestion-chip" data-question="Show me top rated products">
                        <i class="fas fa-star"></i> Top Rated
                    </button> -->
                    <button class="suggestion-chip" data-question="Show me top discounted products">
                        <i class="fas fa-tag"></i> Top Discounted
                    </button>
                    <!-- <button class="suggestion-chip" data-question="Show me top purchased products">
                        <i class="fas fa-fire"></i> Top Purchased
                    </button> -->
                    <button class="suggestion-chip" data-question="Show me products on sale">
                        <i class="fas fa-percent"></i> On Sale
                    </button>
                    <button class="suggestion-chip" data-question="Show me trending products">
                        <i class="fas fa-chart-line"></i> Trending
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- Loading Indicator -->
    <div class="loading-indicator" id="loadingIndicator">
        <div class="loading-spinner"></div>
        <span>Searching fashion picks...</span>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
